version: "3.8"

services:
  asterisk-exporter:
    build: .
    image: asterisk-exporter:latest
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      AMI_HOST: "127.0.0.1"
      AMI_PORT: "5038"
      AMI_USER: "prometheus_monitor"
      AMI_SECRET: "changeme"
      POLL_INTERVAL: "30"
      PJSIP_TRUNKS: "trunk-provider1,trunk-provider2"
      METRICS_LISTEN_ADDRESS: "0.0.0.0"
      METRICS_LISTEN_PORT: "9100"
    # network_mode: host  # Uncomment if Asterisk AMI is only reachable on the host network
